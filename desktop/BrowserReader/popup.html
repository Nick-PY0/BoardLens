<!doctype html><html><meta charset="utf-8"><title>BoardLens reader</title>
<style>body{width:310px;background:#14231d;color:#e5efe8;font:15px system-ui;padding:18px}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:12px;border:1px solid #617f6e;border-radius:8px;background:#20392c;color:white}button{background:#78c997;color:#14231d;font-weight:700}small{display:block;line-height:1.5}p{line-height:1.5}</style>
