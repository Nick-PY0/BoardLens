[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boardlens"
version = "2.11.0"
description = "Local chess analysis with screen recognition, Stockfish and a practice board"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
  "PySide6-Essentials==6.12.0", "opencv-python-headless>=4.10,<5", "numpy>=1.26,<3",
  "python-chess==1.999", "pynput>=1.7.7,<2", "onnxruntime>=1.20,<2",
  "pyobjc-framework-ScreenCaptureKit>=10,<14; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=10,<14; sys_platform == 'darwin'"
]

[project.scripts]
boardlens = "chess_helper.__main__:main"

[tool.setuptools.packages.find]
include = ["chess_helper*"]

[tool.setuptools.package-data]
chess_helper = ["assets/models/*", "assets/pieces/*", "assets/licenses/*", "assets/phone/*", "assets/ui/*", "assets/tiny/*", "assets/tiny/source/*", "assets/tiny/source/Core/**/*.cs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
