name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r desktop/requirements.txt pytest
      - name: Install pinned Stockfish 19
        working-directory: desktop
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          from chess_helper.installer import install_stockfish
          engine = install_stockfish(Path(os.environ['RUNNER_TEMP']) / 'boardlens-stockfish')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('STOCKFISH_EXECUTABLE=' + str(engine) + '\n')
          PYCODE
      - run: python -m pytest -q
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
          PYNPUT_BACKEND: dummy
          BOARDLENS_TEST_MODE: '1'
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest :app:lintRelease --no-daemon
        working-directory: mobile/android
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.404'
      - run: dotnet workload install android
      - name: Check original Tiny bots
        run: dotnet run --project mobile/android/tiny-runtime/Host/Host.csproj -c Release
      - name: Build complete on-phone APK
        run: dotnet build mobile/android/tiny-runtime/BoardLens.Android.csproj -c Release -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
