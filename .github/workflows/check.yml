name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 stockfish
      - run: python -m pip install -r desktop/requirements.txt pytest
      - run: python -m pytest -q
        working-directory: desktop
        env:
          STOCKFISH_EXECUTABLE: /usr/games/stockfish
          QT_QPA_PLATFORM: offscreen
          PYNPUT_BACKEND: dummy
          BOARDLENS_TEST_MODE: '1'
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
        working-directory: mobile/android
