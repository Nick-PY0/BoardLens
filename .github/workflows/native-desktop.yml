name: Native desktop apps
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing draft release to upload after tests
        required: false
        default: ''
        type: string
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
          - os: macos-15-intel
            name: Mac-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build tools
        run: python -m pip install uv==0.11.3 Pillow
      - name: Build Windows app
        if: runner.os == 'Windows'
        run: python desktop/packaging/build_native.py --work native-work --out native-dist
      - name: Build Intel Mac app
        if: runner.os == 'macOS'
        run: uv run --python 3.12.13 --no-project python desktop/packaging/build_native.py --work native-work --out native-dist
      - name: Test Windows GUI app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Get-Content native-dist/native-build.json | ConvertFrom-Json
          $report = Join-Path $PWD 'native-dist/smoke.json'
          $p = Start-Process -FilePath $target.app_path -ArgumentList @('--self-test', $report) -PassThru -Wait
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw 'Native launcher self-test failed' }
          $result = Get-Content $report | ConvertFrom-Json
          if (-not $result.legal_move -or $result.error -or $result.console_window -ne 0) { throw ($result | ConvertTo-Json) }
          Get-Content $report
      - name: Test Mac GUI app
        if: runner.os == 'macOS'
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          data=json.loads(Path('native-dist/native-build.json').read_text())
          report=Path('native-dist/smoke.json').resolve()
          subprocess.run([str(Path(data['app_path'])/'Contents/MacOS/BoardLens'),'--self-test',str(report)],check=True,timeout=180)
          result=json.loads(report.read_text())
          assert result['legal_move'] and not result.get('error'),result
          print(json.dumps(result,indent=2))
          PY
      - name: Upload verified app to draft release
        if: success() && inputs.release_tag != ''
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          BOARDLENS_RELEASE: ${{ inputs.release_tag }}
          BOARDLENS_PLATFORM: ${{ matrix.name }}
        run: |
          import hashlib,json,os,subprocess
          from pathlib import Path
          tag=os.environ['BOARDLENS_RELEASE']
          release=json.loads(subprocess.check_output(['gh','release','view',tag,'--json','isDraft'],text=True))
          assert release['isDraft'],'Only a draft release can receive build uploads'
          data=json.loads(Path('native-dist/native-build.json').read_text())
          asset=Path('native-dist')/data['asset']
          h=hashlib.sha256()
          with asset.open('rb') as f:
              for part in iter(lambda:f.read(1024*1024),b''): h.update(part)
          assert h.hexdigest()==data['sha256']
          smoke=json.loads(Path('native-dist/smoke.json').read_text())
          assert smoke['legal_move'] and not smoke.get('error')
          data.pop('app_path',None);smoke.pop('python',None)
          data['smoke']=smoke
          metadata=Path('native-dist')/('native-'+os.environ['BOARDLENS_PLATFORM']+'.json')
          metadata.write_text(json.dumps(data,indent=2))
          subprocess.run(['gh','release','upload',tag,str(asset),str(metadata),'--clobber'],check=True)
      - name: Collect startup logs
        if: always()
        shell: python
        run: |
          import os,shutil
          from pathlib import Path
          base=Path(os.environ.get('LOCALAPPDATA',str(Path.home()/'Library/Application Support')))/'BoardLens/native/logs'
          if base.exists():
              for file in base.glob('*.log'):
                  target=Path('native-dist')/file.name
                  target.parent.mkdir(exist_ok=True)
                  shutil.copy2(file,target)
                  print(file.read_text(errors='replace')[-12000:])
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: BoardLens-${{ matrix.name }}
          path: |
            native-dist/*.zip
            native-dist/native-build.json
            native-dist/smoke.json
            native-dist/*.log
          compression-level: 0
          retention-days: 14
