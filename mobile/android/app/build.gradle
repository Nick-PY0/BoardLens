plugins { id 'com.android.application' }
android {
    namespace 'app.boardlens.companion'
    compileSdk 36
    defaultConfig { applicationId 'app.boardlens.companion'; minSdk 26; targetSdk 36; versionCode = (project.findProperty('boardlensVersionCode') ?: '6').toString().toInteger(); versionName '1.4.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
