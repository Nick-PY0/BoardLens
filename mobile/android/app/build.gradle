plugins { id 'com.android.application' }
android {
    namespace 'app.boardlens.companion'
    compileSdk 36
    defaultConfig { applicationId 'app.boardlens.companion'; minSdk 26; targetSdk 36; versionCode = (project.findProperty('boardlensVersionCode') ?: '7').toString().toInteger(); versionName '1.5.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false; debuggable false } }
    packaging { jniLibs { useLegacyPackaging true } }
}
dependencies { implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.3'; testImplementation 'junit:junit:4.13.2' }
