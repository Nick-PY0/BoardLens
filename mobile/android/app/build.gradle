plugins { id 'com.android.application' }
android {
    namespace 'app.boardlens.companion'
    compileSdk 36
    defaultConfig { applicationId 'app.boardlens.companion'; minSdk 26; targetSdk 36; ndk { abiFilters 'arm64-v8a' }; versionCode = (project.findProperty('boardlensVersionCode') ?: '14').toString().toInteger(); versionName '1.8.4' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests { includeAndroidResources = true } }
    buildTypes { release { minifyEnabled false; debuggable false } }
    packaging { jniLibs { useLegacyPackaging true } }
}
dependencies { implementation 'org.opencv:opencv:4.12.0'; implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.3'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.17'; testRuntimeOnly 'com.microsoft.onnxruntime:onnxruntime:1.24.3' }
