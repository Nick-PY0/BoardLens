<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#202621;color:#fff;font:16px sans-serif}header{padding:22px 14px}#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:min(calc(100vw - 24px),calc(100vh - 190px));height:min(calc(100vw - 24px),calc(100vh - 190px));margin:12px}.sq{position:relative;min-height:0;min-width:0}.sq img{width:100%;height:100%;display:block}button{padding:12px;margin:12px;background:#9bd6ac;border:0;border-radius:10px}</style><header>Offline QA board · tap squares to move<br><span id="status">Starting position</span></header><div id="board"></div><button onclick="next()">Next position</button><button onclick="flipped=!flipped;render()">Flip board</button><script>
let b='rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR'.split(''),from=-1,flipped=false,ply=0;function render(){board.replaceChildren();for(let i=0;i<64;i++){let at=flipped?63-i:i,d=document.createElement('div');d.className='sq';d.style.background=(Math.floor(i/8)+i%8)%2?'#769656':'#eeeed2';if(b[at]!='.'){let img=document.createElement('img');img.src='pieces/'+(b[at]===b[at].toUpperCase()?'w':'b')+b[at].toUpperCase()+'.svg';d.append(img)}d.onclick=()=>{if(from<0){from=at;document.getElementById('status').textContent='Selected '+at}else{b[at]=b[from];b[from]='.';from=-1;document.getElementById('status').textContent='Move accepted';render()}};board.append(d)}}function next(){const seq=[[52,36],[12,28],[62,45],[1,18]];let [f,t]=seq[ply++%seq.length];b[t]=b[f];b[f]='.';document.getElementById('status').textContent='Position '+ply;render()}render();</script>
